version: '3.8'

services:
  backend:
    build:
      context: Backend
      dockerfile: Dockerfile
    container_name: gestion-absences-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-eu-central-2.pooler.supabase.com:6543/postgres
      - SPRING_DATASOURCE_USERNAME=postgres.yactikaowvlczvwipqzn
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - gestion-absences-network
    restart: always

networks:
  gestion-absences-network:
    driver: bridge
